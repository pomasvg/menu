<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Шкільне меню</title>
  <style>
    /* 👇 СВІТЛА ТЕМА (за замовчуванням) */
    :root {
      --bg: #f7fbff;
      --card: #ffffff;
      --accent: #0066cc;
      --muted: #6b7280;
      --text: #0f172a;
      --border: rgba(11,56,110,0.04);
      --shadow: rgba(12,18,40,0.06);
    }

    /* 👇 ТЕМНА ТЕМА */
    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #3b82f6;
      --muted: #94a3b8;
      --text: #f1f5f9;
      --border: rgba(148,163,184,0.1);
      --shadow: rgba(0,0,0,0.3);
    }

    *{box-sizing:border-box}
    body{font-family:Inter,Segoe UI,Arial; background:var(--bg); margin:0; padding:24px; color:var(--text); transition:background 0.3s, color 0.3s}
    .wrap{max-width:980px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
    h1{font-size:20px;margin:0}
    .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button{background:var(--accent);color:white;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;transition:opacity 0.2s}
    button:hover{opacity:0.9}
    button.ghost{background:transparent;color:var(--accent);border:1px solid rgba(0,102,204,0.12)}
    button:disabled{opacity:0.6;cursor:not-allowed}
    .date-display{font-weight:700}
    .card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 6px 18px var(--shadow);transition:background 0.3s, box-shadow 0.3s}
    .section-title{font-weight:700;margin-top:14px;margin-bottom:8px;color:var(--text)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
    .meal{padding:12px;border-radius:8px;background:var(--card);border:1px solid var(--border);transition:all 0.3s}
    .meal h4{margin:0 0 6px 0;font-size:15px;color:var(--text)}
    .muted{color:var(--muted);font-size:13px}
    .form-row{margin-top:8px}
    textarea,input[type="text"]{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);font-size:14px;background:var(--card);color:var(--text)}
    .status{padding:4px 8px;border-radius:4px;font-size:12px;margin-left:8px}
    .success{background:#d4edda;color:#155724}
    .loading{background:#fff3cd;color:#856404}
    .error{background:#f8d7da;color:#721c24}
    .access-panel{background:var(--bg);padding:15px;border-radius:8px;margin-top:15px;border:1px dashed var(--border)}
    .user-badge{background:#e7f3ff;padding:4px 8px;border-radius:4px;font-size:12px;margin-left:8px}

    /* 👇 КНОПКА ТЕМИ */
    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s;
    }
    .theme-toggle:hover {
      transform: scale(1.05);
    }

    /* 👇 СТРАВИ АБЗАЦАМИ */
    .meal-content {
      white-space: pre-line;
      line-height: 1.6;
    }
    
    /* Додаємо крапки або дефіси для кожного пункту */
    .meal-content ul, .meal-content ol {
      margin: 0;
      padding-left: 20px;
    }
    
    .meal-content li {
      margin: 3px 0;
    }

    @media(max-width:520px){
      header{flex-direction:column;align-items:flex-start}
      .controls{justify-content:flex-start}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>🍽️ Шкільне меню</h1>
        <div class="muted small">Меню на <span id="readableDate">...</span> <span id="status" class="status"></span></div>
      </div>
      <div class="controls">
        <button id="themeToggle" class="theme-toggle">🌙</button>
        <button id="prev" class="ghost">←</button>
        <input type="date" id="date" />
        <button id="next" class="ghost">→</button>
        <button id="today">Сьогодні</button>
        <button id="refresh">🔄 Оновити</button>
        <button id="adminToggle" class="ghost">Адмін</button>
        <span id="userBadge" class="user-badge" style="display:none">👤 Адмін</span>
      </div>
    </header>

    <main class="card">
      <div class="section-title">🏫 Міські діти</div>
      <div id="cityArea" class="grid" aria-live="polite"></div>

      <div class="section-title">🏠 Іногородні діти</div>
      <div id="nonCityArea" class="grid" aria-live="polite"></div>

      <div id="adminSection" style="margin-top:30px;padding-top:20px;border-top:1px solid var(--border)">
        <div style="text-align:center;margin-bottom:15px;">
          <button id="toggleAdminPanel" class="ghost" style="font-size:12px;">👨‍🏫 Розділ для адміністратора</button>
        </div>
        
        <div id="accessPanel" class="access-panel" style="display:none">
          <h3>🔐 Доступ до редагування</h3>
          <div class="form-row">
            <label>Пароль:</label>
            <input type="password" id="adminPassword" placeholder="Введіть пароль" style="width:100%" />
          </div>
          <button id="loginBtn">🔓 Увійти</button>
          <div class="muted" style="margin-top:8px;font-size:12px">
            🤫
          </div>
        </div>

        <div id="editor" style="display:none;margin-top:20px;padding:20px;background:var(--bg);border-radius:8px;">
          <h3>Редагувати меню на <span id="editDateLabel"></span></h3>
        
          </div>
          
          <div class="section-title">🍽️ Міські діти</div>
          <div class="form-row"><label>🍲 Обід</label><textarea id="e_city_lunch" rows="5" placeholder="пиши з абзацами"></textarea></div>

          <div class="section-title">🏠 Іногородні діти</div>
          <div class="form-row"><label>🍳 Сніданок</label><textarea id="e_nc_breakfast" rows="4" placeholder=""></textarea></div>
          <div class="form-row"><label>🍎 Полуденок</label><textarea id="e_nc_snack" rows="3" placeholder=""></textarea></div>
          <div class="form-row"><label>🍲 Обід</label><textarea id="e_nc_lunch" rows="5" placeholder=""></textarea></div>
          <div class="form-row"><label>🥛 Підвечірок</label><textarea id="e_nc_evening" rows="3" placeholder=""></textarea></div>
          <div class="form-row"><label>🍛 Вечеря</label><textarea id="e_nc_dinner" rows="4" placeholder=""></textarea></div>

          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
            <button id="save">💾 Зберегти для всіх</button>
            <button id="cancel" class="ghost">❌ Скасувати</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const ADMIN_PASSWORD = "1234";
    const GITHUB_CONFIG = {
      repoOwner: "Pomasvg",       
      repoName: "menu"
    };

    let currentData = {};
    let isAdmin = false;
    let githubToken = "";

    const dateInput = document.getElementById('date');
    const readableDate = document.getElementById('readableDate');
    const cityArea = document.getElementById('cityArea');
    const nonCityArea = document.getElementById('nonCityArea');
    const editor = document.getElementById('editor');
    const statusEl = document.getElementById('status');
    const accessPanel = document.getElementById('accessPanel');
    const userBadge = document.getElementById('userBadge');

    function isoToday() { return new Date().toISOString().slice(0,10); }
    function niceDate(iso) { return new Date(iso).toLocaleDateString('uk-UA',{year:'numeric',month:'long',day:'numeric'}); }

    function setStatus(text, type = '') {
      statusEl.textContent = text;
      statusEl.className = `status ${type}`;
    }

    // 👇 ТЕМНА/СВІТЛА ТЕМА
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButton(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButton(newTheme);
    }

    function updateThemeButton(theme) {
      const button = document.getElementById('themeToggle');
      button.textContent = theme === 'dark' ? '☀️' : '🌙';
      button.title = theme === 'dark' ? 'Перемкнути на світлу тему' : 'Перемкнути на темну тему';
    }

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    // 👇 ФОРМАТУВАННЯ ТЕКСТУ АБЗАЦАМИ
    function formatMealText(text) {
      if (!text) return '—';
      
      const lines = text.split('\n').filter(line => line.trim() !== '');
      
      if (lines.length > 1) {
        const listItems = lines.map(line => {
          const trimmed = line.trim();
          if (trimmed && !trimmed.startsWith('•') && !trimmed.startsWith('-') && !trimmed.startsWith('*')) {
            return `• ${trimmed}`;
          }
          return trimmed;
        }).join('\n');
        
        return listItems;
      }
      
      return text;
    }

    function utf8_to_b64(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
        return String.fromCharCode('0x' + p1);
      }));
    }

    async function getGitHubToken() {
      if (githubToken) return githubToken;
      
      const savedToken = localStorage.getItem('github_token');
      if (savedToken) {
        githubToken = savedToken;
        return savedToken;
      }
      
      const token = prompt('давай сюда токен');
      if (token) {
        const isValid = await validateToken(token);
        if (isValid) {
          githubToken = token;
          localStorage.setItem('github_token', token);
          return token;
        } else {
          alert('не буду');
          localStorage.removeItem('github_token');
          return null;
        }
      }
      
      return null;
    }

    async function validateToken(token) {
      try {
        const response = await fetch('https://api.github.com/user', {
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        return response.ok;
      } catch (error) {
        return false;
      }
    }

    async function loadData() {
      setStatus('Завантаження...', 'loading');
      try {
        const url = `https://raw.githubusercontent.com/${GITHUB_CONFIG.repoOwner}/${GITHUB_CONFIG.repoName}/main/menu.json`;
        const response = await fetch(url + '?t=' + Date.now());
        
        if (response.ok) {
          const content = await response.json();
          currentData = content;
          setStatus('Оновлено', 'success');
          setTimeout(() => setStatus(''), 3000);
          return true;
        } else if (response.status === 404) {
          currentData = {};
          setStatus('Меню ще не створене', 'success');
          return true;
        } else {
          throw new Error(`Помилка завантаження: ${response.status}`);
        }
      } catch (error) {
        setStatus('Помилка завантаження', 'error');
        console.error('Помилка:', error);
        return false;
      }
    }

    async function saveData() {
      const token = await getGitHubToken();
      if (!token) {
        setStatus('токен давай', 'error');
        return false;
      }

      setStatus('Збереження...', 'loading');
      try {
        const url = `https://api.github.com/repos/${GITHUB_CONFIG.repoOwner}/${GITHUB_CONFIG.repoName}/contents/menu.json`;
        
        let sha = '';
        try {
          const getResponse = await fetch(url, {
            headers: {
              'Authorization': `token ${token}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });
          
          if (getResponse.status === 401) {
            throw new Error('Не буду');
          }
          
          if (getResponse.ok) {
            const fileData = await getResponse.json();
            sha = fileData.sha;
          } else if (getResponse.status !== 404) {
            throw new Error(`Помилка отримання файлу: ${getResponse.status}`);
          }
        } catch (error) {
          if (error.message.includes('Невірний токен')) {
            localStorage.removeItem('github_token');
            githubToken = "";
            throw error;
          }
          if (!error.message.includes('404')) {
            throw error;
          }
        }

        const jsonString = JSON.stringify(currentData, null, 2);
        const content = utf8_to_b64(jsonString);
        
        const response = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Оновлення меню за ${dateInput.value}`,
            content: content,
            sha: sha || undefined
          })
        });

        if (response.ok) {
          setStatus('Збережено для всіх!', 'success');
          setTimeout(() => setStatus(''), 3000);
          return true;
        } else {
          const errorData = await response.json();
          
          if (response.status === 401) {
            localStorage.removeItem('github_token');
            githubToken = "";
            throw new Error('Токен недійсний. Спробуйте ввести новий токен.');
          } else if (response.status === 403) {
            throw new Error('Недостатньо прав. Перевірте чи токен має права "repo".');
          } else if (response.status === 404) {
            throw new Error('Репозиторій не знайдено. Перевірте repoOwner та repoName.');
          } else {
            throw new Error(errorData.message || `Помилка збереження: ${response.status}`);
          }
        }
      } catch (error) {
        setStatus(`Помилка: ${error.message}`, 'error');
        console.error('Помилка збереження:', error);
        
        if (error.message.includes('токен') || error.message.includes('прав')) {
          setTimeout(() => {
            localStorage.removeItem('github_token');
            githubToken = "";
            getGitHubToken();
          }, 2000);
        }
        
        return false;
      }
    }

    // 👇 ФУНКЦІЯ ВІДОБРАЖЕННЯ МЕНЮ (без реакцій)
    function renderForDate(iso) {
      if (!iso) iso = dateInput.value || isoToday();
      readableDate.textContent = niceDate(iso);
      const day = currentData[iso] || { city: { lunch: '' }, nonCity: { breakfast:'', snack:'', lunch:'', evening:'', dinner:'' } };

      cityArea.innerHTML = '';
      const cityLunchCard = document.createElement('div');
      cityLunchCard.className = 'meal';
      
      const cityContent = document.createElement('div');
      cityContent.innerHTML = `<h4>🍽️ Обід</h4><div class="meal-content">${formatMealText(day.city.lunch) || '—'}</div>`;
      cityLunchCard.appendChild(cityContent);
      
      cityArea.appendChild(cityLunchCard);

      nonCityArea.innerHTML = '';
      const fields = [
        ['🍳 Сніданок', 'nc_breakfast', day.nonCity.breakfast],
        ['🍎 Полуденок', 'nc_snack', day.nonCity.snack],
        ['🍲 Обід', 'nc_lunch', day.nonCity.lunch],
        ['🥛 Підвечірок', 'nc_evening', day.nonCity.evening],
        ['🍛 Вечеря', 'nc_dinner', day.nonCity.dinner]
      ];
      
      fields.forEach(([title, mealType, val]) => {
        const div = document.createElement('div');
        div.className = 'meal';
        
        const content = document.createElement('div');
        content.innerHTML = `<h4>${title}</h4><div class="meal-content">${formatMealText(val) || '—'}</div>`;
        div.appendChild(content);
        
        nonCityArea.appendChild(div);
      });
    }

    document.getElementById('today').addEventListener('click', () => {
      dateInput.value = isoToday();
      renderForDate(dateInput.value);
    });

    document.getElementById('prev').addEventListener('click', () => changeDateBy(-1));
    document.getElementById('next').addEventListener('click', () => changeDateBy(1));
    document.getElementById('refresh').addEventListener('click', () => {
      loadData().then(() => renderForDate(dateInput.value));
    });

    function changeDateBy(delta) {
      const cur = new Date(dateInput.value || isoToday());
      cur.setDate(cur.getDate() + delta);
      const iso = cur.toISOString().slice(0,10);
      dateInput.value = iso;
      renderForDate(iso);
    }

    dateInput.addEventListener('change', () => renderForDate(dateInput.value));

    document.getElementById('toggleAdminPanel').addEventListener('click', () => {
      accessPanel.style.display = accessPanel.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('adminToggle').addEventListener('click', () => {
      document.getElementById('adminSection').scrollIntoView({ behavior: 'smooth' });
      accessPanel.style.display = 'block';
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const password = document.getElementById('adminPassword').value;
      if (password === ADMIN_PASSWORD) {
        isAdmin = true;
        accessPanel.style.display = 'none';
        userBadge.style.display = 'inline-block';
        document.getElementById('adminToggle').textContent = 'Редагувати';
        alert('Заповнюй меню');
      } else {
        alert('Не вгадав');
      }
    });

    document.getElementById('adminToggle').addEventListener('click', () => {
      if (!isAdmin) {
        document.getElementById('adminSection').scrollIntoView({ behavior: 'smooth' });
        accessPanel.style.display = 'block';
        return;
      }
      openEditorFor(dateInput.value || isoToday());
    });

    function openEditorFor(iso) {
      const day = currentData[iso] || { city: { lunch: '' }, nonCity: { breakfast:'', snack:'', lunch:'', evening:'', dinner:'' } };
      
      document.getElementById('e_city_lunch').value = day.city.lunch || '';
      document.getElementById('e_nc_breakfast').value = day.nonCity.breakfast || '';
      document.getElementById('e_nc_snack').value = day.nonCity.snack || '';
      document.getElementById('e_nc_lunch').value = day.nonCity.lunch || '';
      document.getElementById('e_nc_evening').value = day.nonCity.evening || '';
      document.getElementById('e_nc_dinner').value = day.nonCity.dinner || '';
      document.getElementById('editDateLabel').textContent = niceDate(iso);
      editor.style.display = 'block';
      editor.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('cancel').addEventListener('click', () => {
      editor.style.display = 'none';
    });

    document.getElementById('save').addEventListener('click', async () => {
      const iso = dateInput.value || isoToday();
      
      currentData[iso] = {
        city: { lunch: document.getElementById('e_city_lunch').value.trim() },
        nonCity: {
          breakfast: document.getElementById('e_nc_breakfast').value.trim(),
          snack: document.getElementById('e_nc_snack').value.trim(),
          lunch: document.getElementById('e_nc_lunch').value.trim(),
          evening: document.getElementById('e_nc_evening').value.trim(),
          dinner: document.getElementById('e_nc_dinner').value.trim()
        }
      };

      const success = await saveData();
      if (success) {
        renderForDate(iso);
        editor.style.display = 'none';
      }
    });

    // 👇 ІНІЦІАЛІЗАЦІЯ
    (async function init() {
      initTheme();
      dateInput.value = isoToday();
      await loadData();
      renderForDate(dateInput.value);
    })();
  </script>
</body>
</html>
